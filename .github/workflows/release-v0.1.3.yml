name: Release v0.1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 89a691df9b775401e4baed1799de74e1680ed94f
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Test and build
        run: gradle clean test build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.3 \
            build/libs/MiraCombat-0.1.3.jar \
            --target 89a691df9b775401e4baed1799de74e1680ed94f \
            --title "MiraCombat v0.1.3" \
            --notes "Suppresses modern player attack sound cues and adds persistent indestructible PvP armor-stand dummies with /mcombat dummy add and /mcombat dummy remove."
