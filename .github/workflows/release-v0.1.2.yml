name: Release v0.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 8f8a22d893baa07119ea5885786627265e0d802e

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2 \
            build/libs/MiraCombat-0.1.2.jar \
            --target 8f8a22d893baa07119ea5885786627265e0d802e \
            --title "MiraCombat v0.1.2" \
            --notes "Expands the legacy-server policy layer. Removes respawn anchors, end crystals, totems, heavy cores, breeze rods, trial keys, ominous trial keys, wind charges, bundles and recovery compasses for normal players in addition to existing restricted modern combat items. Blocks Copper Golem, Breeze, Warden and Happy Ghast spawns, and cancels future Ancient City, Trial Chamber and Trail Ruins world generation. Existing generated structures are not removed."
