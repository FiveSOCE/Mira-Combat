name: Release v0.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: e086587a11d6a35d359502363754da6dd5fc0ffe

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 \
            build/libs/MiraCombat-0.1.1.jar \
            --target e086587a11d6a35d359502363754da6dd5fc0ffe \
            --title "MiraCombat v0.1.1" \
            --notes "Adds clean legacy combat tooltips by hiding modern Attack Damage and Attack Speed attribute lines. Adds configurable restricted modern items with Trident, Mace, Shield, Spear and Wind Charge disabled by default. Restricted items are blocked from crafting and pickup and are deleted from normal-player inventories with a private warning. OPs bypass through miracombat.restricted-items.bypass."
