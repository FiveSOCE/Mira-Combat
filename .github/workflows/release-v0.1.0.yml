name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 1da0d83eb4c0314fe8e09da7ce93bc69be191df2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            build/libs/MiraCombat-0.1.0.jar \
            --target 1da0d83eb4c0314fe8e09da7ce93bc69be191df2 \
            --title "MiraCombat v0.1.0" \
            --notes "Initial MiraCombat foundation for Paper 1.21.11 and Java 21. Adds modern attack-cooldown removal, configurable PvP knockback, sprint reset behaviour, sweep and shield disabling, rod/snowball/egg knockback, ender-pearl cooldown control, legacy satiated regeneration, MiraCore registration, diagnostics, and a public API. Exact PvP tuning remains intentionally configurable for in-game testing."
