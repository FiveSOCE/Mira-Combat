combat:
  enabled: true

  # A very high attack speed removes the modern 1.9+ weapon cooldown while
  # keeping normal server-side hit processing intact.
  attack-speed: 1024.0

  # Vanilla-style hurt resistance is still useful for consistent combos.
  # 20 is the classic Minecraft maximum. Tune later if the server needs a
  # faster or slower hit rhythm.
  maximum-no-damage-ticks: 20

  disable-sweep-attacks: true
  disable-shields: true
  reset-sprint-on-hit: true

  legacy-tooltips:
    # Removes the modern Attack Damage / Attack Speed attribute lines from
    # swords, axes and other combat-capable tools while preserving real stats.
    hide-attack-attributes: true

  restricted-items:
    enabled: true
    delete-message: "&cThis item is disabled and has been deleted."
    materials:
      - TRIDENT
      - MACE
      - SHIELD
      - SPEAR
      - WIND_CHARGE
      - RESPAWN_ANCHOR
      - END_CRYSTAL
      - TOTEM_OF_UNDYING
      - HEAVY_CORE
      - BREEZE_ROD
      - TRIAL_KEY
      - OMINOUS_TRIAL_KEY
      - BUNDLE
      - RECOVERY_COMPASS

  world-policy:
    blocked-mobs:
      - COPPER_GOLEM
      - BREEZE
      - WARDEN
      - HAPPY_GHAST
    blocked-structures:
      - ANCIENT_CITY
      - TRIAL_CHAMBERS
      - TRAIL_RUINS

  knockback:
    enabled: true
    horizontal: 0.40
    vertical: 0.40
    vertical-limit: 0.40
    sprint-horizontal-bonus: 0.18
    sprint-vertical-bonus: 0.02
    enchantment-horizontal-bonus-per-level: 0.12

  projectiles:
    fishing-rod-knockback: true
    snowball-knockback: true
    egg-knockback: true
    horizontal: 0.32
    vertical: 0.28
    vertical-limit: 0.38

  ender-pearls:
    cooldown-ticks: 0

  regeneration:
    legacy-satiated-regeneration: true
    interval-ticks: 80
    heal-amount: 1.0
    minimum-food-level: 18
    exhaustion-per-heal: 3.0
